<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>逃獄 · 無人機</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;background:#000;overflow:hidden}body{display:grid;place-items:center;font-family:system-ui,sans-serif;color:#eee}#stage{position:relative;width:min(100vw,56.25dvh);height:min(100dvh,177.78vw);background:#000;overflow:hidden}#scene{width:100%;height:100%;display:block;object-fit:contain;transition:opacity .12s}#stage.travel #scene{opacity:.35}button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid white;outline-offset:3px}button[hidden],[hidden]{display:none!important}.arrow{position:absolute;width:70px;height:70px;border:0;background:none;padding:4px;filter:drop-shadow(0 0 9px #d81639)}.arrow img{width:100%;height:100%;object-fit:contain;pointer-events:none}#forward{left:calc(50% - 35px);top:53%}#left{left:5%;top:68%}#right{right:5%;top:68%}#back{left:calc(50% - 35px);bottom:5%}#door{position:absolute;left:34%;top:24%;width:41%;height:42%;background:transparent;border:0;padding:0}#door-notice{background:#000b}#table{position:absolute;background:transparent;border:0;padding:0}#table-eye{position:absolute;transform:translate(-50%,-50%);width:clamp(24px,5.5vw,34px);height:clamp(24px,5.5vw,34px);padding:4px;border-radius:50%;color:#fff;background:#101417b8;box-shadow:0 0 8px #0008;pointer-events:none}#table:hover #table-eye{color:#ffb4bb;background:#34191ee6}#table:focus-visible{outline:2px solid #ffb4bb;border-radius:5px}#paper-confirm{position:absolute;left:50%;transform:translateX(-50%);bottom:4%;margin:0;min-width:120px}svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2}.overlay{position:fixed;inset:0;z-index:20;background:#000;display:grid;place-items:center;padding:24px}.box{text-align:center;max-width:560px;width:100%}.box h1{font-size:clamp(26px,6vw,40px);font-weight:500;letter-spacing:.12em}.box p{white-space:pre-wrap;line-height:1.8;font-size:22px;overflow-wrap:anywhere}.confirm{border:1px solid #a64350;border-radius:5px;padding:13px 30px;min-height:50px;background:#702532;color:white;font:inherit;font-size:18px;margin-top:24px}#reader{background:#000e}#reader .box{background:#202429;padding:28px;border:1px solid #555;border-radius:6px;max-height:85dvh;overflow:auto}@media(prefers-reduced-motion:reduce){#scene{transition:none}}
</style></head><body><main id="stage" aria-label="無人機逃獄迷宮"><img id="scene" alt="監獄場景" draggable="false"><button class="arrow" id="forward" aria-label="往前"><img src="assets/arrows/arrow-up.png" alt=""></button><button class="arrow" id="right" aria-label="往右"><img src="assets/arrows/arrow-right.png" alt=""></button><button class="arrow" id="back" aria-label="往後"><img src="assets/arrows/arrow-down.png" alt=""></button><button class="arrow" id="left" aria-label="往左"><img src="assets/arrows/arrow-left.png" alt=""></button><button id="door" hidden aria-label="嘗試打開大門"></button><button id="table" hidden aria-label="查看右邊桌上的文件"><span id="table-eye" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></span></button><button id="paper-confirm" class="confirm" hidden>確定</button></main><section id="door-notice" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="door-message"><div class="box"><p id="door-message">這只是台無人機，沒辦法打開大門</p><button id="door-confirm" class="confirm">確定</button></div></section><section id="capture" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="caught-title"><div id="capture-message" class="box" hidden><h1 id="caught-title">你被發現了</h1><button id="restart" class="confirm">重新開始</button></div></section><section id="goal" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="goal-title"><div class="box"><h1 id="goal-title">目標：</h1><p id="objective"></p><button id="goal-confirm" class="confirm">確定</button></div></section><script src="maze.js"></script><script src="lower-maze.js"></script><script src="scenes.js"></script><script src="game.js"></script></body></html>
