name: Auto Sync Google Docs

# 設定觸發時間與條件
on:
  schedule:
    # 這裡採用 UTC 時間，相當於每天台灣時間凌晨 4:00 自動執行一次
    - cron: '0 20 * * *'
  workflow_dispatch: # 這行讓你可以在 GitHub 網頁上隨時手動點擊按鈕執行

permissions:
  contents: write # 賦予寫入權限，讓 GitHub 可以把更新後的檔案 Commit 回去

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1. 複製 repository 檔案到雲端環境
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. 安裝 Python 依賴套件（若有 requirements.txt 會自動安裝）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. 執行同步腳本
      - name: Run sync script
        run: |
          python sync_reader.py

      # 5. 檢查是否有檔案變更，並自動 Commit 和 Push 回 GitHub
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto sync Google Docs content" && git push)
